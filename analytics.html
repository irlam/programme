<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analytics — Apartment Programme</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0f172a;color:#e5e7eb;margin:0}
  header{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding:12px 14px;background:#111827;border-bottom:1px solid #1f2937}
  .pill{background:#1f2937;padding:6px 10px;border-radius:999px;font-size:12px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){ .grid{grid-template-columns:1fr 1fr} }
  .card{background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px}
  h3{margin:0 0 8px 0}
  a{color:#93c5fd}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  select,input,button{background:#111827;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:8px}
  button{background:#2563eb;border-color:#1d4ed8}
</style>
</head>
<body>
<header>
  <div class="pill">Project: <strong style="margin-left:6px;">#1</strong></div>
  <div class="row">
    <a class="pill" href="/api/export/shortterm.php?project=1&days=14&group=apartment" target="_blank">Short-term (Apt)</a>
    <a class="pill" href="/api/export/shortterm.php?project=1&days=14&group=contractor" target="_blank">Short-term (Contractor)</a>
    <a class="pill" href="/" title="Back to Gantt">Back</a>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div class="card">
      <h3>Workforce (Ops per Day)</h3>
      <canvas id="ops"></canvas>
    </div>
    <div class="card">
      <h3>Tight Handovers (per Week)</h3>
      <canvas id="tight"></canvas>
    </div>
    <div class="card" style="grid-column:1/-1">
      <h3>Throughput (Started vs Finished per Week)</h3>
      <canvas id="throughput"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
(async function(){
  // Workforce
  const wf = await (await fetch('/api/analytics.php?project=1&type=workforce')).json();
  const ctx1 = document.getElementById('ops');
  new Chart(ctx1, {
    type:'line',
    data:{labels:wf.labels, datasets:[{label:'Total Ops', data:wf.total}]},
    options:{responsive:true, scales:{y:{beginAtZero:true}}}
  });

  // Tight per week (stacked bar by contractor)
  const tight = await (await fetch('/api/analytics.php?project=1&type=tight')).json();
  const contractors = new Set();
  tight.data && Object.values(tight.data).forEach(obj => Object.keys(obj).forEach(c=>contractors.add(c)));
  const datasets = Array.from(contractors).map((c,idx)=>({
    label:c,
    data: tight.weeks.map(w=> (tight.data[w]?.[c] || 0)),
    stack:'tight'
  }));
  const ctx2 = document.getElementById('tight');
  new Chart(ctx2, { type:'bar',
    data:{labels:tight.weeks||[], datasets},
    options:{responsive:true, scales:{x:{stacked:true}, y:{stacked:true, beginAtZero:true}}}
  });

  // Throughput
  const tp = await (await fetch('/api/analytics.php?project=1&type=throughput')).json();
  const ctx3 = document.getElementById('throughput');
  new Chart(ctx3, {
    type:'bar',
    data:{labels:tp.weeks, datasets:[
      {label:'Started', data:tp.started},
      {label:'Finished', data:tp.finished}
    ]},
    options:{responsive:true, scales:{y:{beginAtZero:true}}}
  });
})();
</script>
</body>
</html>
