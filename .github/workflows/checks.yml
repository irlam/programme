name: Programme checks
on:
  push:
    branches: [main, work/suite-gateway-client, work/suite-read-only]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, curl, ctype
      - name: PHP syntax
        run: |
          find app api bin tests admin tools -name '*.php' -print0 | xargs -0 -n1 php -l
          if [ -f suite-login.php ]; then php -l suite-login.php; fi
      - name: Private configuration
        run: php tests/private-config.php
      - name: Suite gateway boundary checks
        if: hashFiles('tests/suite-gateway.php') != ''
        run: php tests/suite-gateway.php
      - name: Maintenance HTTP boundaries
        run: python3 tests/maintenance-web-guards.py
      - name: Suite local identity mapping
        if: hashFiles('tests/suite-user-map.php') != ''
        run: php tests/suite-user-map.php
      - name: Short-term PDF rendering
        run: |
          php tests/shortterm-report.php
          python3 tests/shortterm-window.py
      - name: Schedule regressions
        run: python3 tests/schedule_regression.py
      - name: Suite server session boundaries
        if: hashFiles('tests/suite-session.php') != ''
        run: php tests/suite-session.php
      - name: Suite HTTP boundaries
        if: hashFiles('tests/suite-http.py') != ''
        run: python3 tests/suite-http.py
      - name: Read-only deployment preflight
        run: |
          php tests/suite-preflight.php
          php tests/suite-binding.php
      - name: Suite deployment package
        if: hashFiles('tests/suite-package.py') != ''
        run: python3 tests/suite-package.py

  workspace-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/programme-dom" --no-save --ignore-scripts jsdom@26.1.0
      - name: Workspace and client navigation regressions
        run: PROGRAMME_TEST_JSDOM="$RUNNER_TEMP/programme-dom/node_modules/jsdom" node tests/workspace_dom.cjs

  plesk-staging:
    needs: [php, workspace-dom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/suite-read-only'
    permissions:
      contents: write
    concurrency:
      group: programme-plesk-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate and prepare Plesk staging tree
        run: |
          python3 tests/plesk-tree.py
          python3 bin/build-plesk-tree.py "$RUNNER_TEMP/programme-plesk-files" --source-ref "$(git rev-parse HEAD)"
          find "$RUNNER_TEMP/programme-plesk-files" -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Publish checked staging deployment branch
        run: |
          source_commit="$(git rev-parse HEAD)"
          latest_source="$(git ls-remote origin refs/heads/work/suite-read-only | cut -f1)"
          if [ "$source_commit" != "$latest_source" ]; then exit 0; fi
          git fetch origin deploy/suite-staging
          git worktree add --detach "$RUNNER_TEMP/programme-plesk-git" FETCH_HEAD
          cd "$RUNNER_TEMP/programme-plesk-git"
          git rm -r --ignore-unmatch .
          cp -a "$RUNNER_TEMP/programme-plesk-files/." .
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='Programme deployment' -c user.email='programme-deploy@users.noreply.github.com' commit -m "Deploy checked Suite Programme $source_commit"
          git push origin HEAD:refs/heads/deploy/suite-staging
